version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: eu-north-1
    AWS_ACCOUNT_ID: "161327178744"
    IMAGE_REPO_NAME: laravel-app
    IMAGE_TAG: latest
    REPOSITORY_URI: 161327178744.dkr.ecr.eu-north-1.amazonaws.com/laravel-app
    ECS_CLUSTER: awsapp
    ECS_SERVICE: awsapp

phases:
  install:
    runtime-versions:
      nodejs: 20
      php: 8.2
    commands:
      - echo Installing PHP and Node dependencies...
      - composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
      - npm ci

  pre_build:
    commands:
      - echo Preparing Laravel for asset build...
      # Do NOT create .env here — it would be baked into the image via docker build.
      # Runtime entrypoint + ECS env vars configure production MySQL.
      - cp -n .env.example .env || true
      - php artisan key:generate --force || true
      - php artisan ziggy:generate || true
      - rm -f .env
      - rm -f bootstrap/cache/config.php bootstrap/cache/routes*.php bootstrap/cache/events.php
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - echo Repository URI is $REPOSITORY_URI

  build:
    commands:
      - echo Building frontend assets...
      - npm run build
      - echo Building the Docker image...
      - docker build --no-cache -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo Pushing the Docker image...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:$CODEBUILD_BUILD_NUMBER
      - docker push $REPOSITORY_URI:$CODEBUILD_BUILD_NUMBER
      - echo Forcing new ECS deployment...
      - aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment --region $AWS_DEFAULT_REGION
      - echo Build completed on $(date)
      - echo Image pushed $REPOSITORY_URI:$IMAGE_TAG
      - echo Build number tag $REPOSITORY_URI:$CODEBUILD_BUILD_NUMBER
      - echo ECS redeploy started for $ECS_CLUSTER / $ECS_SERVICE
