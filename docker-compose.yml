services:
  php:
    build:
      context: .
      target: php
    working_dir: /var/www
    # Do NOT bind-mount .:/var/www here.
    # A host bind mount replaces the image's /var/www and discards
    # www-data ownership set during docker build, which causes:
    #   storage/logs/laravel.log Permission denied
    # For local dev with a bind mount, use docker-compose.local.yml
    # (entrypoint re-applies permissions on every start).
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MYSQL_ATTR_SSL_CA: ${MYSQL_ATTR_SSL_CA:-/var/www/global-bundle.pem}
    # Local MySQL container is optional when using AWS RDS.
    # depends_on:
    #   - database

