
zend_extension = opcache.so
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 1

memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
max_input_time = 60
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
date.timezone = UTC
