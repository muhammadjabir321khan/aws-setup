services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: local
    container_name: aws-setup-php-local
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      LOG_CHANNEL: stack
      LOG_STACK: single
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      # Must match an existing database in the MySQL volume (run: docker exec aws-setup-database-local mysql -uroot -pjabir321 -e "SHOW DATABASES;")
      DB_DATABASE: awssetup
      DB_USERNAME: admin
      DB_PASSWORD: jabir321
      # Local MySQL container has no SSL — override MYSQL_ATTR_SSL_CA from .env
      MYSQL_ATTR_SSL_CA: ""
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: mysql:8.0
    container_name: aws-setup-database-local
    environment:
      MYSQL_ROOT_PASSWORD: jabir321
      MYSQL_DATABASE: awssetup
      MYSQL_USER: admin
      MYSQL_PASSWORD: jabir321
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data_local:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  db_data_local:
